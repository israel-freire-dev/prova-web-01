<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes • GestorPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex">
  {% include "componentes/sidebar.html" %}

  <main class="flex-1 p-6 lg:p-10">
    <div class="max-w-6xl mx-auto">
      <div class="flex items-start sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">Clientes</h1>
          <p class="text-sm text-gray-600 mt-1">Gerencie seus clientes cadastrados.</p>
        </div>
        <a
          href="{% url "criar_cliente" %}"
          class="inline-flex items-center gap-2 rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-gray-800 transition-colors"
        >
          <span class="text-lg leading-none">+</span>
          Adicionar cliente
        </a>
      </div>

      <section class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-200">
          <p class="text-sm font-medium text-gray-900">Lista de clientes</p>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Nome</th>
                <th scope="col" class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email</th>
                <th scope="col" class="px-5 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Ações</th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              {% for c in clientes %}
                <tr class="hover:bg-gray-50 transition-colors">
                  <td class="px-5 py-4 whitespace-nowrap">
                    <div class="font-medium text-gray-900">{{ c.nome }}</div>
                  </td>
                  <td class="px-5 py-4 whitespace-nowrap">
                    <div class="text-gray-700">{{ c.email }}</div>
                  </td>
                  <td class="px-5 py-4 whitespace-nowrap">
                    <div class="flex items-center justify-end gap-2">
                      <a
                        href="{% url "editar_cliente" c.pk %}"
                        class="inline-flex items-center rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-800 hover:bg-gray-50 transition-colors"
                      >
                        Editar
                      </a>
                      <a
                        href="{% url "excluir_cliente" c.pk %}"
                        class="inline-flex items-center rounded-lg bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-500 transition-colors"
                      >
                        Excluir
                      </a>
                    </div>
                  </td>
                </tr>
              {% empty %}
                <tr>
                  <td colspan="3" class="px-5 py-10 text-center">
                    <p class="text-sm text-gray-600">Nenhum cliente cadastrado ainda.</p>
                    <a
                      href="{% url "criar_cliente" %}"
                      class="inline-flex items-center mt-3 rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800 transition-colors"
                    >
                      Cadastrar primeiro cliente
                    </a>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
