<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • GestorPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Logo placeholder -->
    <div class="flex justify-center">
      <div class="w-12 h-12 bg-gray-900 rounded-xl flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Entrar no GestorPro</h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Ou
      <a href="{% url 'cadastro' %}" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">crie sua
        conta agora</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-sm sm:rounded-xl sm:px-10 border border-gray-100">

      {% if form.errors %}
      <div class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded text-sm text-red-700">
        Usuário ou senha incorretos. Tente novamente.
      </div>
      {% endif %}

      <style>
        input[type="password"],
        input[data-is-password="true"] {
          padding-right: 2.5rem;
        }
      </style>

      <form class="space-y-6" action="" method="POST">
        {% csrf_token %}

        {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
          </label>
          <div class="relative">
            {{ field }}
            {% if 'password' in field.name|lower %}
            <button type="button"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none"
              onclick="togglePassword(this)">
              <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
                <path class="eye-closed hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
            {% endif %}
          </div>
        </div>
        {% endfor %}

        <div>
          <button type="submit"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors">
            Acessar Sistema
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.querySelectorAll('input[type="password"]').forEach(el => el.setAttribute('data-is-password', 'true'));

    function togglePassword(btn) {
      const container = btn.parentElement;
      const input = container.querySelector('input');
      const eyeOpen = btn.querySelectorAll('.eye-open');
      const eyeClosed = btn.querySelectorAll('.eye-closed');

      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.forEach(el => el.classList.add('hidden'));
        eyeClosed.forEach(el => el.classList.remove('hidden'));
      } else {
        input.type = 'password';
        eyeOpen.forEach(el => el.classList.remove('hidden'));
        eyeClosed.forEach(el => el.classList.add('hidden'));
      }
    }
  </script>
</body>

</html>
